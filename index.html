<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ADU Rent Calculator</title>
<meta name="description" content="Build up ADU costs from real components, set expenses and rent growth, and see whether the rent covers the loan." />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpolygon points='2,17 10,6 18,17' fill='%2358a6ff'/%3E%3Crect x='4' y='17' width='12' height='11' fill='%2358a6ff'/%3E%3Cpolygon points='18,22 24,14 30,22' fill='%2379b8ff'/%3E%3Crect x='19.5' y='22' width='9' height='7' fill='%2379b8ff'/%3E%3C/svg%3E" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&display=swap" rel="stylesheet">

<style>
  :root { color-scheme: light dark; }
  * { -webkit-tap-highlight-color: transparent; }
  body { margin: 0; }
  #root { text-align: left; }

  /* Numeric columns line up only with tabular figures — Fraunces defaults to
     proportional, which makes the table columns visibly ragged. */
  table, input[type="number"] { font-variant-numeric: tabular-nums; }

  /* Real keyboard focus rings. The JSX was faking focus with onFocus/onBlur
     handlers that set borderColor, which never fires for keyboard users. */
  button:focus-visible, input:focus-visible, [role="button"]:focus-visible {
    outline: 2px solid #58a6ff;
    outline-offset: 2px;
    border-radius: 4px;
  }
  .fld:focus { border-color: #58a6ff !important; }
  input[type="range"]:focus-visible { outline: 2px solid #58a6ff; outline-offset: 3px; }

  /* Strip the spinner arrows — they collide with the /mo suffix. */
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type="number"] { -moz-appearance: textfield; }

  button:disabled { cursor: not-allowed; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }

  /* Full model: inputs left, sticky results right on wide screens; one column below 1000px. */
  .int-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 440px); gap: 16px; align-items: start; }
  .int-results { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow-y: auto; }
  .mini-bar { display: none !important; }
  @media (max-width: 999px) {
    .int-grid { display: block; }
    .int-results { position: static; max-height: none; overflow: visible; }
    .mini-bar { display: flex !important; }
  }
  /* Printing — from either view — produces the formal report instead of the screen UI. */
  .print-report { display: none; }
  @media print {
    .screen-only { display: none !important; }
    .print-report { display: block !important; }
    html, body { background: #fff !important; color-scheme: light; }
    .print-report tr, .print-report li { break-inside: avoid; }
    /* Keep the report's rules, bands and chart fills. */
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    @page {
      size: letter;
      margin: 0.7in 0.6in 0.7in;
      @bottom-left { content: "Estimates only — not an appraisal, tax advice, or offer of credit"; font: 8px 'DM Sans', sans-serif; color: #94a3b8; }
      @bottom-right { content: "Page " counter(page) " of " counter(pages); font: 8px 'DM Sans', sans-serif; color: #64748b; }
    }
  }
</style>
</head>
<body>
<div id="root"></div>
